<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Whole Life of a Flower</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#03040a;color:#f3f4ff;font:500 14px system-ui,-apple-system,sans-serif;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));text-align:center;pointer-events:none;text-shadow:0 1px 8px #000}
h1{font-size:clamp(13px,3.8vw,19px);letter-spacing:.14em;font-weight:700}
#info{font-size:12px;opacity:.75;margin-top:4px;letter-spacing:.08em}
#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(520px,calc(100% - 16px));
 background:rgba(13,15,34,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px}
button{background:rgba(255,255,255,.07);color:inherit;border:1px solid transparent;border-radius:14px;min-height:44px;min-width:44px;padding:0 14px;font:inherit;cursor:pointer;white-space:nowrap}
button[aria-pressed=true],button[aria-selected=true]{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.6)}
button:focus-visible,input:focus-visible{outline:2px solid #7fe;outline-offset:2px}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#tabs button{padding:0 4px;background:none}
#tabs button[aria-selected=true]{background:rgba(255,255,255,.14);border-color:transparent}
.tray{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px}
.tray[hidden]{display:none}
.tray::-webkit-scrollbar{display:none}
.tray button{flex:none}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;vertical-align:-2px}
input[type=color]{flex:none;width:44px;height:44px;border:0;padding:4px;background:none;cursor:pointer}
.bar{display:flex;align-items:center;gap:6px}
.bar button{padding:0;font-size:17px;width:44px;flex:none}
input[type=range]{flex:1;min-width:0;height:44px;accent-color:#7ff5e0;background:none}
#show{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;opacity:.5}
body.clean #panel{display:none}
body.clean #show{display:block}
@media (min-width:900px){
 #panel{left:auto;right:16px;bottom:50%;transform:translateY(50%);width:340px;padding:14px}
 .tray{flex-wrap:wrap;overflow:visible;min-height:150px;align-content:flex-start}
}
@media (max-height:520px) and (orientation:landscape){
 #panel{left:auto;right:8px;transform:none;width:320px}
 header{right:336px}
}
button:hover{background:rgba(255,255,255,.15)}
#kind .card{display:flex;flex-direction:column;align-items:center;gap:2px;width:68px;padding:6px 2px 5px;font-size:11px}
#kind canvas{width:36px;height:36px}
#full{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top));padding:0;font-size:18px}
#keys{display:none}
@media (max-width:599px){#full{display:none}}
@media (min-width:900px) and (min-height:521px){
 #kind{display:grid;grid-template-columns:repeat(4,1fr);max-height:min(46vh,380px);overflow-y:auto;min-height:0}
 #kind[hidden]{display:none}
 #kind .card{width:auto}
 #full{left:14px;right:auto}
 #keys{display:block;position:fixed;left:16px;bottom:12px;font-size:12px;opacity:.55;pointer-events:none}
 body.clean #keys{display:none}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Animated glowing flower with butterflies. Tap for sparkles."></canvas>
<header><h1>THE WHOLE LIFE OF A FLOWER</h1><div id="info" aria-hidden="true"></div></header>
<nav id="panel" aria-label="Flower controls">
  <div id="tabs" role="tablist">
    <button role="tab" data-t="kind" aria-selected="true">Flower</button><button role="tab" data-t="colors">Color</button>
    <button role="tab" data-t="style">Bloom</button><button role="tab" data-t="scene">Sky</button>
  </div>
  <div class="tray" id="kind"></div>
  <div class="tray" id="colors" hidden><input type="color" id="custom" value="#ff50be" aria-label="Custom flower color"></div>
  <div class="tray" id="style" hidden></div>
  <div class="tray" id="scene" hidden></div>
  <div class="bar">
    <button id="play" aria-label="Pause">❚❚</button>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Flower life timeline">
    <button id="surprise" aria-label="Surprise me" title="Surprise me">🎲</button>
    <button id="fly" aria-label="Butterflies" title="Butterflies" aria-pressed="true">🦋</button>
    <button id="hide" aria-label="Hide controls" title="Hide controls (H)">✕</button>
  </div>
</nav>
<button id="full" aria-label="Full screen" title="Full screen (F)">⛶</button>
<p id="keys">Space pause · ← → flower · S surprise · H hide · F full screen</p>
<button id="show">Show controls</button>
<script>
"use strict";
const W=540,H=960,CX=270,ROOT=800,STEM=470,LIFE=29,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=(x,s,w=.2)=>{const k=clamp((x-s)/w);return k*k*(3-2*k)};
const ease=x=>1-(1-clamp(x))**3;
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${clamp(a)})`;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const WHITE=[255,255,255],GREY=[120,118,135],TEAL=[60,255,215],GOLD=[255,225,160];

// ---------- colors ----------
const PRESETS={Pink:'#ff50be',Red:'#ff2e4d',Violet:'#9d5cff',Magenta:'#f21fe0'};
let target=hex(PRESETS.Pink),pink=target.slice();
function setColor(h){
  target=hex(h);$('custom').value=h;
  document.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===h));
  try{localStorage.setItem('flowerColor',h)}catch(e){}
}
for(const [n,h] of Object.entries(PRESETS)){
  const b=document.createElement('button');b.dataset.c=h;
  b.innerHTML=`<span class="dot" style="background:${h}"></span>${n}`;
  b.onclick=()=>setColor(h);$('colors').insertBefore(b,$('custom'));
}
$('custom').oninput=e=>setColor(e.target.value);
let saved=null;try{saved=localStorage.getItem('flowerColor')}catch(e){}
setColor(/^#[0-9a-f]{6}$/i.test(saved)?saved:PRESETS.Pink);pink=target.slice();

// ---------- fixed geometry ----------
// rings: [petal count, length, half-width, opening angle, curl]
const FLOWERS={
  Dahlia:{shape:'point',core:'stamen',rings:[[7,66,22,.43,.7],[9,92,29,.7,.7],[12,122,34,.98,.7],[15,150,36,1.25,.7]]},
  Lotus:{shape:'point',core:'pod',rings:[[6,78,30,.22,.1],[8,100,38,.62,.25],[10,124,42,1.08,.35]]},
  Rose:{shape:'round',core:'none',rings:[[4,56,34,.38,-.8],[5,72,44,.62,-.45],[7,90,54,.95,.15],[8,106,62,1.25,.75]]},
  Daisy:{shape:'round',core:'disk',rings:[[18,112,13,1.2,.25],[24,140,13,1.45,.3]]},
  Tulip:{shape:'cup',core:'none',rings:[[3,128,60,.72,-.8],[3,136,66,.82,-.85]]},
  Sakura:{shape:'notch',core:'stamen',rings:[[5,128,54,1.22,.15]]},
  Lily:{shape:'point',core:'stamen',rings:[[3,148,40,.72,1.3],[3,158,30,.82,1.55]]},
  Peony:{shape:'ruffle',core:'stamen',rings:[[6,54,30,.3,-.6],[8,74,38,.55,-.3],[9,94,44,.85,.1],[10,114,50,1.2,.5]]},
  Poppy:{shape:'ruffle',core:'dark',rings:[[3,108,72,.85,-.2],[3,120,80,1.1,.1]]},
  Cosmos:{shape:'notch',core:'disk',rings:[[8,138,36,1.3,.1]]},
  Hibiscus:{shape:'ruffle',core:'column',rings:[[5,134,68,1.0,.6]]},
  Magnolia:{shape:'round',core:'pod',rings:[[3,104,38,.25,-.3],[4,130,48,.55,0],[4,138,52,.95,.2]]},
  Mum:{shape:'point',core:'none',rings:[[12,52,8,.25,-1.4],[16,76,9,.55,-1],[20,100,10,.9,-.5],[24,128,11,1.3,.2]]},
  Sunflower:{shape:'point',core:'seeds',rings:[[17,128,19,1.2,.3],[21,146,18,1.45,.4]]},
  Anemone:{shape:'round',core:'dark',rings:[[6,104,46,.95,-.1],[7,124,50,1.22,.15]]},
  'Water Lily':{shape:'point',core:'pod',rings:[[8,80,18,.3,-.2],[10,108,24,.75,-.1],[13,136,27,1.22,-.15],[14,150,24,1.5,-.35]]},
  Camellia:{shape:'round',core:'stamen',rings:[[5,66,38,.55,-.2],[7,92,46,.95,.1],[8,116,52,1.3,.2]]},
  Aster:{shape:'point',core:'disk',rings:[[26,108,8,1.05,.2],[34,134,8,1.35,.35],[30,144,7,1.5,.55]]},
  Zinnia:{shape:'round',core:'disk',rings:[[10,62,17,.55,-.2],[13,86,22,.9,.1],[16,110,24,1.2,.3],[19,134,25,1.45,.4]]},
  Plumeria:{shape:'round',core:'none',twist:.55,rings:[[5,128,58,1.12,.15]]},
  Daffodil:{shape:'round',core:'stamen',rings:[[8,66,28,.38,.2],[3,134,52,1.18,.2],[3,140,50,1.34,.2]]},
  Carnation:{shape:'frill',core:'none',rings:[[7,62,26,.35,-.3],[9,84,32,.65,0],[11,102,36,.95,.2],[13,118,40,1.28,.4]]}
};
let kind='Dahlia',style='Gentle',petals=[];
function buildPetals(){
  let k=11;const rand=()=>(k=(k*16807)%2147483647)/2147483647;
  petals=[];
  const rings=FLOWERS[kind].rings,total=rings.reduce((a,x)=>a+x[0],0);let n0=0;
  rings.forEach(([n,len,wid,th,curl],ring)=>{
    for(let i=0;i<n;i++)petals.push({ring,len,wid,th,curl,order:n0++/total,around:i/n,
      phi:TAU*i/n+(ring%2)*Math.PI/n+ring*.2,fall:.76+rand()*.15,spin:rand()*2.4-1.2,ph:rand()*6,
      sp:Array.from({length:Math.min(16,Math.ceil(240/total))},()=>[.25+rand()*.75,rand()*2-1,rand()*6])});
  });
}
// how far a petal has opened (0..1) for each kind of bloom
function openness(p,life,t){
  if(style==='Spiral')return smooth(life,.41+p.order*.17,.09);
  if(style==='Burst'){
    const k=clamp((life-.47)/.09)-1;
    return .12*smooth(life,.4,.06)*(life<.47)+(life<.47?0:Math.max(.12,1+2.7*k*k*k+1.7*k*k));
  }
  const o=smooth(life,.42+p.ring*.035);
  if(style==='Breathing')return o*(1+.16*Math.sin(t*2.2-p.ring*.8)*smooth(life,.58,.06));
  if(style==='Wave')return o*(1+.2*Math.sin(t*3-p.around*TAU)*smooth(life,.58,.06));
  return o;
}
const dust=Array.from({length:220},()=>({x:rnd()*W,y:rnd()*H,s:4+rnd()*14,p:rnd()*6,r:.5+rnd()*1.1}));
const pollen=Array.from({length:130},()=>({p:rnd(),a:rnd()*TAU,s:40+rnd()*150}));
const LEAVES=[[.22,-1,100,.5],[.42,1,118,.58],[.6,-1,86,.7]];

const groundY=x=>ROOT+3+40*(1-Math.exp(-(((x-CX)/260)**2)));
const stemPoint=(y,t,d)=>{const f=y/STEM;return[CX+14*Math.sin(y/80+t)+d*150*f*f,ROOT-y*(1-.12*d*f)]};

function glow(x,y,rx,ry,col,a){
  if(a<=.003)return;
  ctx.save();ctx.translate(x,y);ctx.scale(rx,ry);
  const g=ctx.createRadialGradient(0,0,0,0,0,1);
  g.addColorStop(0,rgb(col,a));g.addColorStop(.35,rgb(col,a*.4));g.addColorStop(1,rgb(col,0));
  ctx.fillStyle=g;ctx.fillRect(-1,-1,2,2);ctx.restore();
}
function dot(x,y,r,col,a){ctx.fillStyle=rgb(col,a);ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function path(pts,close){
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  if(close)ctx.closePath();
}

// ---------- stem, leaves, seed and bud ----------
const stemHeight=life=>STEM*(.55*smooth(life,.04,.36)+.45*ease((life-.04)/.34));
function blade(x0,y0,angle,len,wide,bend,col,a,veins){
  // a leaf shape starting at (x0,y0); angle 0 points up
  if(len<2||a<=.01)return;
  ctx.save();ctx.translate(x0,y0);ctx.rotate(angle);
  const g=ctx.createLinearGradient(0,0,0,-len);
  g.addColorStop(0,rgb(mix(col,[3,22,30],veins?.86:.55),.96*a));g.addColorStop(1,rgb(mix(col,[3,22,30],veins?.58:.12),.94*a));
  const shape=new Path2D();
  shape.moveTo(0,0);
  shape.bezierCurveTo(-wide,-len*.28,-wide*.85+bend*.5,-len*.72,bend,-len);
  shape.bezierCurveTo(wide*.85+bend*.5,-len*.72,wide,-len*.28,0,0);
  ctx.globalCompositeOperation='source-over';ctx.fillStyle=g;ctx.fill(shape);ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=1.3;ctx.strokeStyle=rgb(col,.7*a);ctx.stroke(shape);
  ctx.lineWidth=.9;ctx.strokeStyle=rgb(col,.45*a);
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(0,-len*.55,bend*.8,-len*.9);
  for(let i=1;i<=veins;i++){
    const u=i/(veins+1.6),y=-len*u,x=bend*.8*u*u,w=wide*.46*Math.sin(Math.PI*u**.8);
    for(const s of[-1,1]){ctx.moveTo(x,y);ctx.quadraticCurveTo(x+s*w*.5,y-len*.05,x+s*w,y-len*.13)}
  }
  ctx.stroke();ctx.restore();
}
function drawStem(h,t,d){
  if(h<1)return;
  const col=mix(TEAL,GREY,d*.85),n=60,left=[],right=[],mid=[];
  const thick=1.6+3.4*smooth(h,0,STEM);
  for(let i=0;i<=n;i++){
    const u=i/n,p=stemPoint(h*u,t,d),w=thick*(1-.55*u)+.5;
    left.push([p[0]-w,p[1]]);right.unshift([p[0]+w,p[1]]);mid.push(p);
  }
  ctx.lineCap=ctx.lineJoin='round';
  for(const [w,a] of[[18,.05],[10,.1]]){ctx.lineWidth=w;ctx.strokeStyle=rgb(col,a);path(mid);ctx.stroke()}
  ctx.fillStyle=rgb(mix(col,[4,60,60],.35),.9);path(left.concat(right),true);ctx.fill();
  ctx.lineWidth=1.2;ctx.strokeStyle=rgb(WHITE,.6*(1-d));path(mid);ctx.stroke();
}
function drawLeaves(h,t,d){
  const col=mix(TEAL,GREY,d*.85);
  for(const [frac,side,len,ang] of LEAVES){
    const ha=frac*STEM,g=ease((h-ha)/150);if(g<=0)continue;
    const [x,y]=stemPoint(ha,t,d);
    // starts folded against the stem, then opens outwards
    const open=smooth(g,.15,.8),a=side*(.15+(1.22-ang*.35)*open+.9*d)+.035*Math.sin(t*1.4+ha);
    blade(x,y,a,len*1.08*g,len*(.08+.24*open)*g,side*len*.18*open,col,1,6);
  }
}
function drawSeed(life,t,h){
  const col=mix(GOLD,TEAL,smooth(life,.05,.08));
  const fall=clamp(life/.028);
  if(life<.07){
    const y=ROOT-210*(1-fall*fall),a=1-smooth(life,.045,.025);
    glow(CX+Math.sin(0+t)*0,y,22,22,GOLD,.8*a);
    ctx.fillStyle=rgb(GOLD,a);ctx.beginPath();ctx.ellipse(CX,y,4,6,.3,0,TAU);ctx.fill();
  }
  const k=(life-.028)/.07;
  if(k>0&&k<1)for(let i=0;i<2;i++){
    const q=clamp(k*1.4-i*.35);
    ctx.strokeStyle=rgb(col,.8*(1-q));ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(CX,ROOT+3,6+90*ease(q),2+14*ease(q),0,0,TAU);ctx.stroke();
  }
  // two first little leaves
  const g=smooth(life,.045,.07)*(1-smooth(life,.2,.08));
  if(g>0){
    const [x,y]=stemPoint(Math.min(h,44),t,0);
    for(const s of[-1,1])blade(x,y,s*(.2+.95*smooth(life,.07,.07)),30*g,10*g,s*5,TEAL,g,2);
  }
  // fireflies of energy spiralling up around the growing tip
  const grow=smooth(life,.04,.04)*(1-smooth(life,.34,.08));
  if(grow>0)for(let i=0;i<26;i++){
    const u=(t*.45+i/26)%1,a=u*9+i%2*Math.PI+t,r=(28-18*u)*(.4+.6*grow);
    const p=stemPoint(Math.max(0,h-90*(1-u)),t,0);
    const alpha=grow*Math.sin(Math.PI*u)*(.55+.45*Math.cos(a));
    dot(p[0]+Math.cos(a)*r,p[1]+Math.sin(a)*r*.25,1.7,mix(TEAL,WHITE,.5),alpha);
  }
  const [x,y]=stemPoint(h,t,0),tip=smooth(life,.04,.03)*(1-smooth(life,.24,.08));
  glow(x,y,20,20,TEAL,.8*tip);dot(x,y,2.5,WHITE,tip);
}
function drawBud(life,t,top,d,opened){
  const size=smooth(life,.22,.2),col=mix(TEAL,GREY,d*.85);
  if(size<=0)return;
  const split=smooth(life,.4,.14),a=1-clamp(opened*3);
  if(a>.01){
    // closed bud, swelling and slightly breathing
    const bh=(14+52*size)*(1+.02*Math.sin(t*3)),bw=bh*.34;
    glow(top[0],top[1]-bh*.5,bh,bh,pink,.25*a*size);
    for(const [lean,w,k] of[[-.1,1,.8],[.1,1,.8],[0,1.15,1]])
      blade(top[0],top[1],lean,bh*k,bw*w,-lean*bw,pink,a*smooth(size,.15,.4),0);
  }
  // sepals wrap the bud, then fold back as it opens
  for(const [dir,back] of[[-1,1],[1,1],[-.5,.6],[.5,.6],[0,0]]){
    const ang=dir*(.22+1.9*split+.5*d),len=(13+36*size)*(1-.25*split);
    if(dir===0&&split>.05)continue;
    blade(top[0]+dir*3,top[1]+3,ang,len,len*.2,-dir*len*.3*(1-split),col,1-.25*back*split,1);
  }
}

// ---------- flower head ----------
function drawBloom(life,t,top,d){
  const base=mix(pink,GREY,d),list=[];
  for(const p of petals){
    const o=openness(p,life,t),open=o*1.25;if(o<=.01)continue;
    const shape=FLOWERS[kind].shape;
    const L=p.len*(.25+.75*Math.sqrt(o)),th=o*p.th+d*(.5+.1*p.ring);
    let c=.2+o*(p.curl-.2)+d*1.1;if(Math.abs(c)<.02)c=.02;
    const a=t*.25,tau=Math.max(0,(life-p.fall)*LIFE),tl=d*1.15;
    const project=(u,v)=>{
      let wide;
      if(shape==='point')wide=Math.sin(Math.PI*u**.8)**.8;
      else wide=Math.sqrt(Math.max(0,1-(2*u**(shape==='cup'?1.1:1.35)-1)**2))*(shape==='cup'?1-.25*u*u:1);
      if(shape==='ruffle')wide*=1+.12*Math.sin(u*19+p.ph)*u;
      if(shape==='frill'){wide=Math.min(1,u*1.5)**.8*(u>.9?1-(u-.9)*5:1);if(u>.65)u+=.05*Math.sin(v*14+p.ph)*Math.abs(v);}
      if(shape==='notch'){wide=Math.max(wide,.55*smooth(u,.7,.3));u*=1-.32*(1-Math.abs(v))**2*u**4;}
      const r=L*(Math.cos(th)-Math.cos(th+c*u))/c,z=L*(Math.sin(th+c*u)-Math.sin(th))/c;
      const lat=v*p.wid*(L/p.len)*wide+(FLOWERS[kind].twist||0)*p.wid*u*u*(L/p.len);
      const X=r*Math.cos(p.phi)-lat*Math.sin(p.phi),Z=r*Math.sin(p.phi)+lat*Math.cos(p.phi);
      const xr=X*Math.cos(a)+Z*Math.sin(a),zr=-X*Math.sin(a)+Z*Math.cos(a);
      const y=-(z*Math.cos(.68)-zr*Math.sin(.68))+Math.abs(v)*-3*u;
      return[top[0]+xr*Math.cos(tl)-y*Math.sin(tl),top[1]+xr*Math.sin(tl)+y*Math.cos(tl),zr];
    };
    let left=[],right=[],mid=[];
    for(let i=0;i<=14;i++){const u=i/14;left.push(project(u,1));right.push(project(u,-1));mid.push(project(u,0))}
    const sparks=p.sp.map(([u,v,ph])=>[...project(u,v*.9),ph]);
    if(tau>0){ // petal lets go and falls
      const m=mid[7].slice(),an=p.spin*Math.min(tau,2.2),k=Math.min(tau,3);
      const move=q=>{
        const dx=q[0]-m[0],dy=q[1]-m[1];
        const x=m[0]+dx*Math.cos(an)-dy*Math.sin(an)+Math.sin(tau*1.7+p.ph)*18*k;
        const y=m[1]+dx*Math.sin(an)+dy*Math.cos(an)+58*d*tau*tau;
        q[0]=x;q[1]=Math.min(y,groundY(x)-2);
      };
      [left,right,mid,sparks].forEach(s=>s.forEach(move));
    }
    list.push({p,left,right,mid,sparks,z:mid[10][2],vis:clamp(open*4)});
  }
  list.sort((a,b)=>a.z-b.z); // back petals first
  for(const {p,left,right,mid,sparks,z,vis} of list){

  for(const f of flies){

    const a=i*2.4,q=60+(i*37)%130,x=hc[0]+Math.cos(a)*q,y=hc[1]+Math.sin(a)*q*.65,len=4+9*k;
    ctx.strokeStyle=rgb(WHITE,k);ctx.beginPath();
    ctx.moveTo(x-len,y);ctx.lineTo(x+len,y);ctx.moveTo(x,y-len);ctx.lineTo(x,y+len);ctx.stroke();
    glow(x,y,len,len,pink,.6*k);
  }
  // butterfly trails and tap sparkles
  for(let i=sparks.length-1;i>=0;i--){
    const q=sparks[i],age=(t-q.born)/q.life;
    if(age>=1||age<0){sparks.splice(i,1);continue}
    const e=t-q.born;
    dot(q.x+q.vx*e,q.y+q.vy*e+30*e*e,q.r*(1-age*.6),q.col,1-age);
  }
  // glow: squaring a shrunken copy keeps only the bright parts, which are added back
  ctx.setTransform(1,0,0,1,0,0);
  for(const {c} of bloomLayers.slice(0,low?2:3)){
    const b=c.getContext('2d');
    b.globalCompositeOperation='copy';b.drawImage(cv,0,0,c.width,c.height);
    b.globalCompositeOperation='multiply';b.drawImage(c,0,0);
  }
  const power=(scene==='Aurora'||scene==='Galaxy')?.9:.7;
  bloomLayers.slice(0,low?2:3).forEach(({c},i)=>{ctx.globalAlpha=[.2,.28,.38][i]*power;ctx.drawImage(c,0,0,cv.width,cv.height)});
  view(ctx);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  const stage=[[.05,'SEED'],[.2,'SPROUT'],[.4,'GROWTH'],[.7,'BLOOM'],[.93,'WILT'],[2,'REBIRTH']].find(s=>life<s[0])[1];
  const text=kind+' · '+stage+' · DAY '+String(life*91|0).padStart(3,'0');
  if($('info').textContent!==text)$('info').textContent=text;
  return hc;
}

// ---------- sizing, controls, loop ----------
function resize(){
  const vw=innerWidth,vh=innerHeight,panel=$('panel').getBoundingClientRect(),clean=document.body.classList.contains('clean');
  if(!vw||!vh)return;
  // the part of the screen not covered by the header or the controls
  let aw=vw,ah=vh;const top=52;
  if(!clean){if(vw>=900||(vh<=520&&vw>vh))aw=panel.left;else ah=panel.top}
  const fit=Math.min(aw/440,(ah-top)/770);
  const dpr=Math.min(devicePixelRatio||1,2,Math.sqrt((low?9e5:2.2e6)/(vw*vh)));
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);scale=fit*dpr;
  // flower art spans roughly y = 110..840 in scene units
  const cssY=top+(ah-top-770*fit)/2-110*fit,cssX=aw/2-CX*fit;
  V.ox=cssX*dpr;V.oy=cssY*dpr;
  V.x0=-cssX/fit;V.x1=(vw-cssX)/fit;V.y0=-cssY/fit;V.y1=(vh-cssY)/fit;
  for(const l of bloomLayers){l.c.width=Math.max(1,cv.width/l.k|0);l.c.height=Math.max(1,cv.height/l.k|0)}
  paintBackdrop();
}
function toggle(){paused=!paused;$('play').textContent=paused?'▶':'❚❚';$('play').setAttribute('aria-label',paused?'Play':'Pause')}
const clean=on=>{document.body.classList.toggle('clean',on);resize()};
$('play').onclick=toggle;
$('hide').onclick=()=>clean(true);$('show').onclick=()=>clean(false);
$('fly').onclick=()=>{showFlies=!showFlies;$('fly').setAttribute('aria-pressed',showFlies)};
$('seek').oninput=e=>{life=e.target.value/1000;sparks.length=0};
document.querySelectorAll('[data-t]').forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll('[data-t]').forEach(o=>{o.setAttribute('aria-selected',o===tab);$(o.dataset.t).hidden=o!==tab});
  resize();
});

function icon(name){ // small top view of each flower
  const f=FLOWERS[name],c=document.createElement('canvas');c.width=c.height=72;
  const g=c.getContext('2d');g.translate(36,36);
  const max=Math.max(...f.rings.map(x=>x[1]));
  f.rings.slice().reverse().forEach(([n,len,wid],i)=>{
    const L=33*len/max*(f.shape==='cup'&&i?.8:1),w=Math.min(wid/len*L*.95,L*.55);
    for(let k=0;k<n;k++){
      g.save();g.rotate(TAU*k/n+i*.4);g.beginPath();g.moveTo(0,0);
      if(f.shape==='point')g.bezierCurveTo(L*.3,-w,L*.7,-w*.7,L,0),g.bezierCurveTo(L*.7,w*.7,L*.3,w,0,0);
      else{g.bezierCurveTo(L*.35,-w*1.1,L*1.05,-w*1.1,f.shape==='notch'?L*.8:L,0);
        if(f.shape==='notch')g.lineTo(L*.8,0);
        g.bezierCurveTo(L*1.05,w*1.1,L*.35,w*1.1,0,0)}
      g.fillStyle=`hsla(0,0%,100%,${.16+i*.09})`;g.fill();g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=1;g.stroke();g.restore();
    }
  });
  g.fillStyle={disk:'#ffd45c',seeds:'#9a5a1e',dark:'#3a1840',pod:'#cfd96a'}[f.core]||'#ffe9a8';
  g.beginPath();g.arc(0,0,f.core==='seeds'?13:6,0,TAU);g.fill();
  return c;
}
const MENUS={kind:Object.keys(FLOWERS),style:['Gentle','Spiral','Burst','Breathing','Wave'],scene:Object.keys(SCENES)};
function choose(id,v){
  if(!MENUS[id].includes(v))return;
  for(const b of $(id).children)b.setAttribute('aria-pressed',b.textContent===v);
  if(id==='kind'){kind=v;buildPetals()}
  if(id==='style')style=v;
  if(id==='scene'){scene=v;if(scale)paintBackdrop()}
  try{localStorage.setItem('flower_'+id,v)}catch(e){}
}
for(const id in MENUS){
  for(const v of MENUS[id]){
    const b=document.createElement('button');
    if(id==='kind'){b.className='card';b.append(icon(v))}
    b.append(v);
    b.onclick=()=>{choose(id,v);if(id!=='scene')life=.4};
    $(id).appendChild(b);
  }
  let old=null;try{old=localStorage.getItem('flower_'+id)}catch(e){}
  choose(id,MENUS[id].includes(old)?old:MENUS[id][0]);
}
$('surprise').onclick=()=>{
  const pick=a=>a[Math.random()*a.length|0];
  for(const id in MENUS)choose(id,pick(MENUS[id]));
  setColor(pick(Object.values(PRESETS)));life=.4;
};
const point=e=>[(e.clientX*cv.width/innerWidth-V.ox)/scale,(e.clientY*cv.height/innerHeight-V.oy)/scale];
cv.addEventListener('pointermove',e=>[touch.x,touch.y]=point(e));
for(const ev of['pointerleave','pointerup','pointercancel'])cv.addEventListener(ev,e=>{if(ev==='pointerleave'||e.pointerType!=='mouse')touch.x=touch.y=-999});
$('full').hidden=!document.fullscreenEnabled;
$('full').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
const step=n=>{const list=MENUS.kind;choose('kind',list[(list.indexOf(kind)+n+list.length)%list.length]);life=.4;
  $('kind').querySelector('[aria-pressed=true]').scrollIntoView({block:'nearest',inline:'nearest'})};
cv.addEventListener('pointerdown',e=>{
  [touch.x,touch.y]=point(e);
  const x=touch.x,y=touch.y;
  for(let i=0;i<36;i++){
    const a=Math.random()*TAU,q=30+Math.random()*110;
    sparks.push({x,y,vx:Math.cos(a)*q,vy:Math.sin(a)*q-30,born:t,life:.7+Math.random()*.7,r:2.4,col:i%3?mix(pink,WHITE,.35):GOLD});
  }
});
addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  if(e.key==='h')clean(!document.body.classList.contains('clean'));
  if(e.key==='r')life=0;
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='s')$('surprise').click();
  if(e.key==='f')$('full').click();
});
addEventListener('resize',resize);
buildPetals();resize();

let last=performance.now(),hc=[CX,300];
function loop(now){
  const raw=(now-last)/1000,dt=Math.min(raw,.05);last=now;
  slow=raw>1/34&&raw<.5?slow+raw:Math.max(0,slow-raw*.5);
  if(!low&&slow>3){low=true;resize()}
  pink=mix(pink,target,Math.min(1,dt*6));
  // when paused, time stops for the flower but tap sparkles still finish
  t+=dt;
  if(!paused){life=(life+dt/LIFE)%1;moveFlies(dt,t,hc);$('seek').value=life*1000;if(showFlies&&life>.35&&life<.85)trails()}
  hc=draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
